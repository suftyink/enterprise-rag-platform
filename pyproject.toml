[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Enterprise RAG knowledge platform with governed ingestion, retrieval, evaluation, and release workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pymilvus==2.6.14",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "playwright>=1.55,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "uv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_assistant"]

[tool.fastapi]
entrypoint = "erp_assistant.main:app"

[tool.pytest.ini_options]
addopts = "-q --cov=erp_assistant --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["erp_assistant"]
mypy_path = "src"
ignore_missing_imports = true
